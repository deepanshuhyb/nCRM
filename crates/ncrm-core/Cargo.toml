[package]
name = "ncrm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
calamine = "0.38.0"
csv = "1.4.0"
hmac = "0.13.0"
rand = "0.10.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { workspace = true }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["macros", "serde", "serde-human-readable"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
rust_xlsxwriter = "0.104.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
