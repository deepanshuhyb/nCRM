[package]
name = "ncrm-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sqlx = { workspace = true }
anyhow = "1.0.104"
axum = "0.8.9"
ncrm-core = { version = "0.1.0", path = "../ncrm-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
axum-extra = { version = "0.12.6", features = ["cookie"] }
time = "0.3.55"
uuid = { version = "1.29.3", features = ["serde"] }
tower-http = { version = "0.7.1", features = ["set-header", "timeout", "trace"] }
tower = "0.5.3"

[dev-dependencies]
http-body-util = "0.1.5"
rust_xlsxwriter = "0.104.0"
tower = { version = "0.5.3", features = ["util"] }
