# nginx in front of ncrm. Put in /etc/nginx/sites-available/ncrm, link it
# into sites-enabled, replace app.example.com, then:
#
#   sudo certbot --nginx -d app.example.com     # gets and installs the certificate
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx is the only thing listening on the internet. It forwards to the
# dashboard on 127.0.0.1:3000; the API has no public port at all.

# How many requests one address may make. The API has its own, stricter
# limits on sign-in; this is a coarse outer guard.
limit_req_zone $binary_remote_addr zone=ncrm:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    # Everything goes to https.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    # certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    # Browsers that have visited once insist on https for a year.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Spreadsheet imports are up to 2 MB; nothing else comes close.
    client_max_body_size 3m;

    # Meta delivers incoming WhatsApp messages here. This is the only
    # path that reaches the API directly; the API checks Meta's signature
    # on every delivery and ignores anything unsigned.
    location = /webhooks/whatsapp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
    }

    location / {
        limit_req zone=ncrm burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the API trusts this header for its
        # per-address limits, so a visitor must not be able to set it.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Pages stream (a skeleton first, then the content): don't hold
        # the response back.
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
